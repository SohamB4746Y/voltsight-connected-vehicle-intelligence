extends: default
rules:
  colons: { max-spaces-after: -1 }
  commas: { max-spaces-after: -1 }
  braces: { min-spaces-inside: 0, max-spaces-inside: 1 }
  brackets: { min-spaces-inside: 0, max-spaces-inside: 1 }
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
ignore: |
  deploy/helm/*/templates/
  deploy/compose/config/

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate throwaway .env
        run: python tools/dev/gen_env.py
      - name: Compose file is valid
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env config -q
      - name: Live (public) compose profile is valid
        run: |
          PUBLIC_URL=https://demo.example.test docker compose -f deploy/compose/docker-compose.yml \
            -f deploy/compose/docker-compose.live.yml --env-file .env config -q
          PUBLIC_URL=https://demo.example.test PUBLIC_HOST=demo.example.test docker compose --profile tls \
            -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.live.yml --env-file .env config -q
      - name: yamllint
        run: |
          pip install yamllint==1.37.1
          yamllint -s -c .yamllint.yml deploy .github
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect \
            --source /repo --no-banner --redact --verbose
      - name: Misconfiguration and secret scan (trivy fs)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.74.0 fs \
            --scanners misconfig,secret --severity HIGH,CRITICAL --exit-code 1 \
            --skip-files /repo/.env --skip-dirs /repo/web/node_modules --ignorefile /repo/.trivyignore /repo

  g1:
    name: gate G1 (contracts, database, identity, PKI, seed)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: bufbuild/buf-setup-action@v1
      - name: Install generators and linters (pinned)
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Generate throwaway .env
        run: python tools/dev/gen_env.py
      - name: Run gate G1 (same script used locally; Testcontainers + compose stack)
        env:
          BUF_BASELINE_REF: HEAD~1
        run: python tools/gates/g1.py
      - name: Upload G1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-G1
          path: evidence/G1

  app:
    name: application (build, unit tests, web, helm, terraform)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build every binary
        run: go build ./...
      - name: Unit tests (no external services; simulator-based analytics tests included)
        run: go test -count=1 ./internal/... ./cmd/... ./tools/reqtrace/...
      - name: Requirement traceability gate (a PASS needs implementation, verification and existing evidence)
        run: go run ./tools/reqtrace docs/compliance/FINAL_REQUIREMENT_MATRIX.md
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web console type-check, build and audit
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          npm audit --omit=dev
      - uses: azure/setup-helm@v4
      - name: Helm lint and render
        run: |
          helm lint deploy/helm/voltsight
          helm template vs deploy/helm/voltsight > /tmp/vs.yaml
          docker run --rm -v /tmp/vs.yaml:/vs.yaml ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas /vs.yaml
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform validate (AWS, GCP)
        run: |
          for d in aws gcp; do
            terraform -chdir=deploy/terraform/$d init -backend=false -input=false
            terraform -chdir=deploy/terraform/$d validate
          done

  image:
    name: container image (build, non-root check, scan; publish on main)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry paths must be lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the production image (all services + web console)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runs as non-root, ships every service binary and the console
        run: |
          test "$(docker inspect -f '{{.Config.User}}' "$IMAGE:ci")" = "65532:65532"
          for c in vsapi vsgateway vsworker vssink vsalerts vssim vsdb vspki vstopics; do
            docker run --rm --entrypoint /app/$c "$IMAGE:ci" -h >/dev/null 2>&1 || test $? -le 2
          done
          docker image inspect "$IMAGE:ci" --format 'size={{.Size}}'
      - name: Image vulnerability scan (HIGH and CRITICAL, reported)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 image \
            --severity HIGH,CRITICAL --exit-code 0 "$IMAGE:ci"
      - name: Publish to GHCR (main and tags only)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: otel-app-metrics
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
